# Cloudflare Workers configuration for API
name = "bountyhub-api"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "functions/index.ts"

# Cron trigger to run cleanup every hour
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "bountyhub-db"
database_id = "062c1240-4857-4cb9-bb0c-e6880b1c48b6"
migrations_dir = "drizzle/migrations"

# R2 object storage (create with: wrangler r2 bucket create bountyhub-media --config wrangler.workers.toml)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "bountyhub-media"

# KV for cache / rate limits / feature flags
[[kv_namespaces]]
binding = "CACHE"
id = "912fc2937534477cbfc53bdbfb9b4b99"

# Durable Object for chat room WebSockets (one DO instance per room)
[[durable_objects.bindings]]
name = "CHAT_ROOM_DO"
class_name = "ChatRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoomDO"]

# Non-secret public config only. Secrets are set via:
#   wrangler secret put <NAME> --config wrangler.workers.toml
# Required secrets: SESSION_SECRET, SOLANA_RPC_URL, SOLANA_WALLET_PRIVATE_KEY,
# SOLANA_WALLET_ADDRESS, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET, HTML2PDF_API_KEY,
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, GITHUB_PAT, CRON_SECRET, TOKEN_ENCRYPTION_KEY
[vars]
NODE_ENV = "production"
SOLANA_DEVNET_RPC_URL = "https://api.devnet.solana.com"
CLOUDINARY_CLOUD_NAME = "dqobhvk07"
CLOUDINARY_UPLOAD_PRESET = "bountyhub"
VITE_GIPHY_API_KEY = ""
VITE_CLOUDINARY_CLOUD_NAME = "dqobhvk07"
VITE_CLOUDINARY_UPLOAD_PRESET = "bountyhub"
VITE_API_URL = "https://api.bountyhub.tech"
GITHUB_CALLBACK_URL = "https://api.bountyhub.tech/auth/callback"
GITHUB_RELEASES_REPO = "chiku524/bountyhub"
